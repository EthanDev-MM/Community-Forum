<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Forum - Myanmar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 onclick="showHome()" style="cursor:pointer">Community Forum</h1>
        <p>မြန်မာပြည်သူများအတွက် အချင်းချင်းကူညီဖလှယ်ရာနေရာ</p>
    </header>

    <main id="main-content">
        <div id="home-page">
            <section id="categories">
                <h2>Categories</h2>
                <div class="category-grid">
                    <button onclick="openCategory('Housing', '🏠')">🏠 Housing</button>
                    <button onclick="openCategory('Employment', '💼')">💼 Employment</button>
                    <button onclick="openCategory('Health', '🏥')">🏥 Health</button>
                    <button onclick="openCategory('General', '🌍')">🌍 General</button>
                </div>
            </section>
        </div>

        <div id="category-page" style="display: none;">
            <button onclick="showHome()" class="back-btn">⬅ Back to Home</button>
            <h2 id="category-title">Category Name</h2>
            
            <section id="post-form-section">
                <h3>Post အသစ်တင်ရန်</h3>
                <form id="postForm">
                    <input type="text" id="userName" placeholder="သင့်နာမည်" required>
                    <textarea id="postContent" placeholder="အကြောင်းအရာ ရေးသားပါ..." required></textarea>
                    <input type="file" id="imageUpload" accept="image/*">
                    <button type="submit">Post တင်မည်</button>
                </form>
            </section>

            <hr>
            <div id="postsContainer"></div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
